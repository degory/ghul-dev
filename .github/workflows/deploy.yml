name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Two different things, and conflating them is how the host key check fails:
  # SSH_HOST is the machine being deployed to, whose key deploy/known_hosts
  # carries, and SITE is the name it serves once it has been.
  SSH_HOST: playground.ghul.dev
  SITE: ghul.dev
  DEPLOY_USER: deploy

# One deploy at a time. A push that lands while one is running waits its turn
# rather than cancelling it, so the site is never left half-way between two
# builds by a cancelled run.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # Kept so a build is always retrievable from the run, whatever state the
      # host is in.
      - name: Upload dist folder
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ./src/.vitepress/dist/

      # The deploy key is the only secret here. The host and its key are public
      # facts, so they are committed rather than held as secrets. It is a
      # second key in the same deploy account's authorized_keys rather than a
      # copy of the playground's, so either can be revoked without stopping the
      # other repository from deploying.
      - name: Prepare SSH
        env:
          DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          install -m 644 deploy/known_hosts ~/.ssh/known_hosts

      - name: Deploy the site
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./src/.vitepress/dist/ \
            "$DEPLOY_USER@$SSH_HOST:/var/www/ghul-dev/"

      # The isolation header is checked rather than assumed. Without it the
      # site still looks entirely correct, and the only thing that breaks is
      # the embedded playground, which needs the page framing it to be
      # cross-origin isolated before it can start.
      - name: Check the site came back
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://$SITE/")
          echo "site -> $code"
          test "$code" = 200

          curl -sI "https://$SITE/" | grep -qi '^cross-origin-embedder-policy: require-corp'
          curl -sI "https://$SITE/" | grep -qi '^cross-origin-opener-policy: same-origin'
